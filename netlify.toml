[build]
  publish = "."

# Same-origin proxies so the browser never hits CORS limits.
# The user's API key travels in the Authorization header, never stored server-side.
[[redirects]]
  from = "/suno/*"
  to = "https://api.sunoapi.org/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/suno-upload/*"
  to = "https://sunoapiorg.redpandaai.co/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache"
